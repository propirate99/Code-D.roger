<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Trip Genie logo">
  <defs>
    <linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1745"/>
      <stop offset="0.55" stop-color="#1d1030"/>
      <stop offset="1" stop-color="#150a24"/>
    </linearGradient>
    <radialGradient id="gGlow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gGenie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34e3ff"/>
      <stop offset="0.45" stop-color="#38bdf8"/>
      <stop offset="0.75" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gTail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="gStar" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="1" stop-color="#f5b800"/>
    </radialGradient>
  </defs>

  <!-- Panel -->
  <rect x="0" y="0" width="512" height="512" rx="64" fill="url(#gPanel)"/>
  <rect x="0" y="0" width="512" height="512" rx="64" fill="url(#gGlow)"/>

  <!-- Genie -->
  <g>
    <!-- Tail -->
    <path d="M236 268
             C 200 268 188 306 196 330
             C 204 353 234 356 250 340
             C 263 327 258 306 243 300
             C 231 295 221 302 222 312
             C 223 322 233 324 239 319
             C 243 316 242 310 237 309
             C 233 308 230 312 232 315"
          fill="url(#gTail)" stroke="none" opacity="0.95"/>
    <!-- Waist / lower torso merges into tail -->
    <path d="M256 150
             C 236 152 222 166 220 190
             C 219 210 226 224 232 238
             C 237 249 240 258 238 268
             C 242 274 250 276 258 274
             C 264 272 268 266 268 258
             C 268 246 274 234 278 222
             C 284 204 284 184 280 170
             C 274 156 264 150 256 150 Z"
          fill="url(#gGenie)"/>
    <!-- Chest / shoulders -->
    <path d="M256 176
             C 232 176 216 192 216 214
             C 216 224 220 232 226 238
             L 240 224 C 244 218 250 214 256 214
             C 262 214 268 218 272 224
             L 286 238 C 292 232 296 224 296 214
             C 296 192 280 176 256 176 Z"
          fill="url(#gGenie)"/>
    <!-- Left arm akimbo -->
    <path d="M218 212
             C 198 216 190 232 196 248
             C 201 262 214 268 226 264
             C 232 262 236 256 236 250
             C 226 252 216 248 213 240
             C 210 232 214 224 222 220
             C 220 216 219 214 218 212 Z"
          fill="url(#gGenie)"/>
    <!-- Right arm akimbo -->
    <path d="M294 212
             C 314 216 322 232 316 248
             C 311 262 298 268 286 264
             C 280 262 276 256 276 250
             C 286 252 296 248 299 240
             C 302 232 298 224 290 220
             C 292 216 293 214 294 212 Z"
          fill="url(#gGenie)"/>
    <!-- Neck / head -->
    <rect x="250" y="150" width="12" height="14" rx="4" fill="url(#gGenie)"/>
    <ellipse cx="256" cy="136" rx="20" ry="22" fill="url(#gGenie)"/>
    <!-- Top knot -->
    <circle cx="262" cy="112" r="8" fill="url(#gGenie)"/>
    <path d="M258 118 C 250 108 246 96 252 90 C 258 95 262 106 264 116 Z" fill="url(#gGenie)"/>
  </g>

  <!-- Sparkles -->
  <g fill="url(#gStar)">
    <path transform="translate(150,150)" d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4 Z"/>
    <path transform="translate(362,142) scale(0.8)" d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4 Z"/>
    <path transform="translate(392,236) scale(0.62)" d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4 Z"/>
    <path transform="translate(128,238) scale(0.55)" d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4 Z"/>
  </g>

  <!-- Wordmark -->
  <g text-anchor="middle">
    <text x="256" y="430"
          font-family="Georgia, 'Times New Roman', serif" font-size="46"
          font-weight="700" letter-spacing="6" fill="#ffffff">TRIP GENIE</text>
    <text x="256" y="474"
          font-family="Georgia, 'Times New Roman', serif" font-size="24"
          font-weight="600" letter-spacing="10" fill="#34e3ff">SINCE 2026</text>
  </g>
</svg>
